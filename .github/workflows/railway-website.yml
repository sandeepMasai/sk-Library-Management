# Setup: GitHub → Settings → Secrets → Actions
#   RAILWAY_TOKEN          — https://railway.app/account/tokens
#   RAILWAY_WEBSITE_SERVICE — website service name or ID (e.g. "website" or UUID)
#
# Railway: same project as backend → + New Service → repo → Root Directory = website
name: Deploy website to Railway

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/railway-website.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy website service
        working-directory: website
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_WEBSITE_SERVICE }}
          VITE_API_URL: https://sk-library-management-production.up.railway.app
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Add RAILWAY_TOKEN in GitHub repo Secrets"
            exit 1
          fi
          if [ -z "$RAILWAY_SERVICE" ]; then
            echo "::error::Add RAILWAY_WEBSITE_SERVICE (service name or ID from Railway dashboard)"
            exit 1
          fi
          railway variables set "VITE_API_URL=${VITE_API_URL}" --service "$RAILWAY_SERVICE" --skip-deploys
          railway up --detach --service "$RAILWAY_SERVICE"
