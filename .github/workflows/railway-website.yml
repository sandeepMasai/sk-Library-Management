# Setup (one time):
#   1. Railway → backend project → + New → GitHub repo → Root Directory = website
#   2. GitHub → Settings → Secrets → RAILWAY_TOKEN (https://railway.app/account/tokens)
#   3. Optional secret RAILWAY_WEBSITE_SERVICE (defaults to "website")
name: Deploy website to Railway

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/railway-website.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy website service
        working-directory: website
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_WEBSITE_SERVICE }}
          VITE_API_URL: https://api.smartlibdesk.in
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Add RAILWAY_TOKEN in GitHub → Settings → Secrets → Actions"
            echo "Create token: https://railway.app/account/tokens"
            exit 1
          fi
          SERVICE="${RAILWAY_SERVICE:-8bab4f3f-ec5d-41a3-83d3-66bf0bfe2bcc}"
          echo "Deploying to service: ${SERVICE}"
          railway variables set "VITE_API_URL=${VITE_API_URL}" --service "${SERVICE}" --skip-deploys || true
          railway up --detach --service "${SERVICE}"
