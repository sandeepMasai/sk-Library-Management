<!doctype html>
<html lang="en">

    <link rel="apple-touch-icon" href="/logo.png" sizes="180x180" />

    <!-- Default SEO (updated per route by src/seo/usePageSeo.ts) -->
    <title>SmartLibDesk — Library Management Software for Study Halls &amp; Institutes</title>
    <meta
      name="description"
      content="SmartLibDesk is a modern library management system for schools, colleges, coaching institutes, and libraries."

    <meta name="author" content="SmartLibDesk" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SmartLibDesk" />

      property="og:description"
      content="SmartLibDesk is a modern library management system for schools, colleges, coaching institutes, and libraries."

    <meta property="og:image" content="https://www.smartlibdesk.in/logo.png" />

    <meta property="og:image:alt" content="SmartLibDesk logo" />

      name="twitter:description"
      content="SmartLibDesk is a modern library management system for schools, colleges, coaching institutes, and libraries."
    />
    <meta name="twitter:image" content="https://www.smartlibdesk.in/logo.png" />

    <!-- Performance: fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"

    />
